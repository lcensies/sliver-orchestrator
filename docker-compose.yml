# docker-compose.yml — E2E Sliver Scenario Orchestrator workspace
#
# One command brings up the whole training range: the C2 (Sliver + scenario-server)
# and the web frontend, wired together. Victims are optional and picked with a
# compose profile:
#
#   make up          # C2 + frontend only            (docker compose up -d)
#   make up-web      # + vulnerable web target for the web initial-access demo
#   make up-victim   # + a self-beaconing Linux victim
#   make down        # stop + remove volumes
#
# External victims — including Windows VMs — attach over the host network (see
# "Reaching VMs" below).
#
# ── Topology (network `soc`, 172.20.0.0/24) ──────────────────────────────────
#
#   browser ── host :8080 ──▶ frontend (nginx SPA)  172.20.0.40
#                                   │  proxies /api/v1  ─────────┐
#                                   ▼                            ▼
#   operator ─ host :18080 REST ─┐                    ┌───────────────────────────┐
#              host :31337 gRPC ─┼──────────────────▶ │  c2   172.20.0.10          │
#   victims  ─ host :80  C2 HTTP ┘                    │  sliver-server + scenario  │
#                                                     └─────────────┬─────────────┘
#            initial_access exploit ────┐   beacons call back to C2_HOST│
#                        ┌──────────────┴────────────┬──────────────┴────────────┐
#                        ▼                           ▼                            ▼
#                 victim-web  172.20.0.30     victim  172.20.0.20          external VM
#                 (vulnerable target)         (self-beaconing)            C2_HOST=<host IP>
#
# Inter-container URLs use the C2's *static IP* (172.20.0.10), not its name, so the
# stack works even where container DNS is unavailable (e.g. rootless podman).
#
# ── Reaching VMs (not just containers) ───────────────────────────────────────
# Off-host victims (VMs, bare metal) reach the C2 through the ports published on
# 0.0.0.0. Copy .env.example to .env, set C2_HOST to the Docker host's LAN IP, and
# implants are built to beacon there. See lab/vm-setup/SETUP.md + the Vagrantfile.
#
# Prerequisites: Docker >= 24 + Compose v2, or podman-compose. scenario-server is
# compiled inside the C2 image (multi-stage, vendored deps, no host toolchain).

networks:
  soc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  sliver-data:
  scenario-db:

services:
  # ── C2 / Orchestrator (Sliver server + scenario-server) ─────────────────────
  c2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sliver-c2
    hostname: c2-server
    networks:
      soc:
        ipv4_address: 172.20.0.10
    ports:
      - "${REST_BIND:-0.0.0.0}:18080:8080"                                 # Scenario REST API
      - "${GRPC_BIND:-0.0.0.0}:31337:31337"                                # Sliver gRPC (sliver-client)
      - "${SLIVER_C2_BIND:-0.0.0.0}:${SLIVER_C2_PORT:-80}:${SLIVER_C2_PORT:-80}"  # Sliver HTTP C2 (beacons)
    volumes:
      - sliver-data:/root/.sliver
      - scenario-db:/var/lib/scenario
      - ./sliver-orchestrator-workspace:/opt/workspace   # atomics + workspace extensions
      - ./examples:/opt/scenario-examples:ro
      - ./lab/exploits:/opt/exploits:ro                  # initial-access module scripts
    environment:
      - SCENARIO_LISTEN=:8080
      - SCENARIO_ATOMICS_DIR=/opt/workspace/atomics
      # Scenario discovery: examples (this repo) + scenarios/ (workspace). Each entry
      # may be a *.yaml file or a folder bundling a scenario YAML + its resources.
      - SCENARIO_DIRS=/opt/scenario-examples:/opt/workspace/scenarios
      # Live pickup: re-scan every N seconds for on-disk edits (0 = off).
      - SCENARIO_WATCH=5
      # Write API-created/updated scenarios back to disk. "last" = last SCENARIO_DIRS
      # entry (the workspace, which is writable — examples is mounted read-only).
      - SCENARIO_WRITE_DIR=last
      - SCENARIO_DB_PATH=/var/lib/scenario/scenario.db
      - SCENARIO_SLIVER_CONFIG=/etc/sliver/scenario-operator.cfg
      - C2_HOST=${C2_HOST:-172.20.0.10}                  # address beacons (containers + VMs) call back to
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Web frontend (nginx SPA, proxies /api/v1 → c2) ──────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: sliver-frontend
    networks:
      soc:
        ipv4_address: 172.20.0.40
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:8080:80"
    environment:
      # nginx resolves this upstream at startup; use the C2's static IP (not its
      # name) so it works even without container DNS. The SPA calls same-origin /api/v1.
      - BACKEND_URL=http://172.20.0.10:8080
    depends_on:
      c2:
        condition: service_healthy
    restart: unless-stopped

  # ── Vulnerable web target — web initial-access demo (`--profile web`) ────────
  # Deliberately-vulnerable app (command injection at GET /ping?host=). Does NOT
  # beacon itself; a chain's `initial_access` step breaches it to obtain a session.
  # Run examples/initial-access-web.yaml (or the first part of full-attack-chain-v2).
  victim-web:
    build:
      context: .
      dockerfile: lab/Dockerfile.victim-web
    container_name: sliver-victim-web
    hostname: victim-web
    profiles: ["web"]
    networks:
      soc:
        ipv4_address: 172.20.0.30
    depends_on:
      c2:
        condition: service_healthy
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE

  # ── Self-beaconing Linux victim (optional: `--profile victim`) ──────────────
  # Downloads the Linux beacon from the API and checks in on its own — the simple
  # path when you just need a session without an exploit step.
  victim:
    build:
      context: .
      dockerfile: lab/Dockerfile.victim
    container_name: sliver-victim
    hostname: victim-1
    profiles: ["victim"]
    networks:
      soc:
        ipv4_address: 172.20.0.20
    environment:
      - C2_HOST=${C2_HOST:-172.20.0.10}
      - SCENARIO_API=http://172.20.0.10:8080/api/v1
    depends_on:
      c2:
        condition: service_healthy
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE   # tweak per technique under test
